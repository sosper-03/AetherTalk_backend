version: '3.8'

services:
  # AetherTalk Backend Application
  aethertalk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aethertalk-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - NODE_ENV=production
      - ERLANG_COOKIE=aethertalk_production_cookie_change_me
      - NODE_NAME=aethertalk@aethertalk
      - PORT=8080
      - SSL_PORT=8443
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=aethertalk
      - DB_USER=aethertalk
      - DB_PASSWORD=secure_password_change_me
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password_change_me
      - JWT_SECRET=jwt_secret_key_change_me
      - ENCRYPTION_KEY=encryption_key_change_me
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
      - AZURE_TRANSLATOR_API_KEY=${AZURE_TRANSLATOR_API_KEY:-}
      - AWS_TRANSLATE_API_KEY=${AWS_TRANSLATE_API_KEY:-}
    volumes:
      - aethertalk_uploads:/opt/aethertalk/uploads
      - aethertalk_recordings:/opt/aethertalk/recordings
      - aethertalk_logs:/opt/aethertalk/logs
    depends_on:
      - postgres
      - redis
    networks:
      - aethertalk-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aethertalk-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=aethertalk
      - POSTGRES_USER=aethertalk
      - POSTGRES_PASSWORD=secure_password_change_me
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./priv/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - aethertalk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aethertalk -d aethertalk"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache and Session Store
  redis:
    image: redis:7-alpine
    container_name: aethertalk-redis
    restart: unless-stopped
    command: redis-server --requirepass redis_password_change_me --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - aethertalk-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: aethertalk-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - aethertalk_uploads:/var/www/uploads:ro
    depends_on:
      - aethertalk
    networks:
      - aethertalk-network

  # TURN Server for WebRTC
  coturn:
    image: coturn/coturn:latest
    container_name: aethertalk-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-65535:49152-65535/udp"
    environment:
      - TURN_USERNAME=aethertalk
      - TURN_PASSWORD=turn_password_change_me
      - TURN_REALM=aethertalk.com
    command: |
      -n
      --log-file=stdout
      --min-port=49152
      --max-port=65535
      --fingerprint
      --lt-cred-mech
      --user=aethertalk:turn_password_change_me
      --realm=aethertalk.com
      --server-name=aethertalk.com
    networks:
      - aethertalk-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  aethertalk_uploads:
    driver: local
  aethertalk_recordings:
    driver: local
  aethertalk_logs:
    driver: local

networks:
  aethertalk-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16